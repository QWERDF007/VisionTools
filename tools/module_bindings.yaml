# Module to C++ implementation class and header bindings.
# Single source of truth for implementation mapping.
# YAML declarations in assets/tools/ dictate all ports, types, and defaults.

host_bindings:
  visionrt.flow.receive.bool: visionrt.receiver
  visionrt.flow.receive.float: visionrt.receiver
  visionrt.flow.receive.float32_ragged2: visionrt.receiver
  visionrt.flow.receive.float64_dense1: visionrt.receiver
  visionrt.flow.receive.float64_dense2: visionrt.receiver
  visionrt.flow.receive.image: visionrt.receiver
  visionrt.flow.receive.int: visionrt.receiver
  visionrt.flow.receive.int64_dense1: visionrt.receiver
  visionrt.flow.receive.int64_dense2: visionrt.receiver
  visionrt.flow.receive.int64_ragged2: visionrt.receiver
  visionrt.flow.receive.roi: visionrt.receiver
  visionrt.flow.receive.string_dense1: visionrt.receiver
  visionrt.flow.receive.string_ragged2: visionrt.receiver
  visionrt.flow.receive.string: visionrt.receiver

modules:
  visiontools_preprocess:
    dll_name: "bin/visiontools_preprocess.dll"
    namespace: "visiontools::preprocess"
    tools:
      "visionrt.image.read":
        class: "ReadImageTool"
        header: "ReadImageTool.h"
      "visionrt.roi.projection":
        class: "RoiProjectionTool"
        header: "RoiProjectionTool.h"
      "visionrt.image.crop":
        class: "ImageCropTool"
        header: "ImageCropTool.h"
      "visionrt.image.preprocess":
        class: "ImagePreprocessTool"
        header: "ImagePreprocessTool.h"
      "visionrt.detection.filter":
        class: "DetectionFilterTool"
        header: "DetectionFilterTool.h"
      "AdaptiveBinaryTool":
        class: "AdaptiveBinaryTool"
        header: "AdaptiveBinaryTool.h"

  visiontools_infer:
    dll_name: "bin/visiontools_infer.dll"
    namespace: "visionrt::infer"
    tools:
      "visionrt.dl.yolo":
        class: "YoloTool"
        header: "YoloModel.h"
