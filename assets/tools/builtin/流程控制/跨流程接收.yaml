schema_version: 1
category: 流程控制
subcategory: 跨流程
tool_id: visionrt.flow.receive
display_name: 跨流程接收
version: 1.0.0
kind: cpp_class
entry:
  registry_name: visionrt.flow.receive
init_params:
- id: source_flow_id
  name: 源流程ID
  type: String
  default: ''
- id: source_node_seq
  name: 源节点序号
  type: String
  default: ''
- id: source_port_id
  name: 源端口ID
  type: String
  default: ''
- id: timeout_ms
  name: 超时时间(ms)
  type: Int
  default: 0
  min: 0
inputs: []
outputs:
- id: value
  name: 接收数据
  type_from:
    flow: source_flow_id
    node: source_node_seq
    port: source_port_id
- id: source_status_code
  name: 源状态码
  type: Int
- id: source_status_message
  name: 源状态消息
  type: String
